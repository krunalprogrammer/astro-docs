<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sasdesk Astro Docs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    max-width: 640px;
    width: 100%;
    background: #171a21;
    border: 1px solid #2a2e37;
    border-radius: 14px;
    padding: 40px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7dd3fc;
    background: rgba(125, 211, 252, 0.1);
    border: 1px solid rgba(125, 211, 252, 0.3);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 12px;
  }
  p {
    color: #a1a8b3;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .btn {
    display: inline-block;
    background: #7dd3fc;
    color: #0f1115;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 8px;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  footer {
    margin-top: 28px;
    font-size: 13px;
    color: #565d6b;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Live on GitHub Pages</span>
    <h1>Sasdesk Astro Docs</h1>
    <p>This page is being served directly from a public GitHub repository using GitHub Pages. Replace this content with your own HTML, CSS, and JS.</p>
    <a class="btn" href="https://github.com/krunalprogrammer/sasdesk-astro-docs" target="_blank">View Repository</a>
    <footer>Deployed via GitHub Pages</footer>
  </div>
</body>
</html>
